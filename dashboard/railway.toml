# Railway config-as-code for the dashboard service. See DEPLOYMENT.md for
# the setup steps (Railway section) -- one thing this file can't do:
# Root Directory ("dashboard") must be set in Railway's dashboard when the
# service is created, not here. As of railwayapp/cli#839 (still open),
# rootDirectory isn't settable via config-as-code at all, only via the
# dashboard or a raw GraphQL mutation.
#
# DEPRECATION NOTE: this format (railway.json/railway.toml "Config as
# Code") is being phased out in favor of a new TypeScript-based
# .railway/railway.ts Infrastructure-as-Code system. This file keeps
# working until Railway's stated cutoff of 2026-12-01 -- migrate before
# then. See CLAUDE.md's decisions log.
#
# healthcheckPath is /login, not / -- / redirects unauthenticated
# requests (proxy.ts), which would make the health check look like a
# failure. /login always renders directly. NODE_VERSION isn't set here
# because config-as-code has no generic env-var block for build-time
# Node version selection the way Render's render.yaml does; set it as a
# regular environment variable in the dashboard instead (see
# DEPLOYMENT.md) -- Railway also reads a .nvmrc/engines field if present,
# but this repo doesn't pin one, so setting NODE_VERSION explicitly in
# the dashboard is the reliable path given the Node >=22 requirement
# from dashboard/package.json's jsdom/vitest/undici versions.
#
# `builder = "RAILPACK"`, not "NIXPACKS": see the comment in
# backend/railway.toml -- a real deploy against this repo showed
# NIXPACKS causing Railway to silently skip the whole [deploy] section.

[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start -- -p $PORT -H 0.0.0.0"
healthcheckPath = "/login"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
